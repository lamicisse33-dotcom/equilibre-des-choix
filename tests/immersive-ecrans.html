<!doctype html><html lang="fr"><meta charset="utf-8"><title>Vérification de l’habillage immersif</title><style>body{margin:0;background:#080e13;color:#e8d8b6;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center}select{padding:8px;background:#17272d;color:inherit}#stage{margin:12px;position:relative}iframe{border:1px solid #a79060;transform-origin:top left;position:absolute;left:0;top:0}small{opacity:.8}</style><header><label>Écran <select id="size"><option value="390,844">Téléphone portrait</option><option value="844,390">Téléphone paysage</option><option value="1366,768">Ordinateur</option><option value="3840,2160">Télévision 4K</option></select></label><small>Contrôle des menus et paramètres réels, sans la scène WebGL.</small></header><div id="stage"><iframe src="interface-immersive.html?edition=70.1" title="Interface d’origine"></iframe></div><script>const frame=document.querySelector('iframe'),size=document.querySelector('select');function resize(){const [w,h]=size.value.split(',').map(Number);const s=Math.min(1,(innerWidth-30)/w,(innerHeight-90)/h);frame.width=w;frame.height=h;frame.style.transform=`scale(${s})`;document.querySelector('#stage').style.height=`${h*s}px`;}size.onchange=resize;onresize=resize;resize();</script></html>

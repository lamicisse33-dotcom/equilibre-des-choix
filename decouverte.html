<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a22"><title>Équilibre des choix — KHALAM</title><link rel="icon" href="./assets/icons/icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#263b3b,#101a22 60%);color:#f5efdf;font:16px/1.5 system-ui,sans-serif;min-height:100svh}button,a{font:inherit}button{cursor:pointer;color:inherit}a{color:#e5bc69}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:4px}header{max-width:960px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;gap:12px;border-bottom:1px solid #ffffff20}header strong{font-family:Georgia,serif;letter-spacing:.08em;font-size:clamp(14px,3vw,22px);color:#e5bc69}header small{display:block;letter-spacing:.16em;color:#b3c1c3;font-size:10px}header button,.secondary{background:transparent;border:1px solid #ffffff36;border-radius:10px;padding:10px 16px}main{max-width:900px;margin:auto;padding:22px 20px 45px}h1,h2{font-family:Georgia,serif;font-weight:500;line-height:1.15;margin:8px 0 12px}h1{font-size:clamp(30px,5vw,49px)}h2{font-size:clamp(24px,4vw,34px)}p{margin:8px 0;color:#d0d9d6}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:#e5bc69;text-transform:uppercase}.panel{background:#18262dd9;border:1px solid #afc2b92b;border-radius:20px;padding:clamp(17px,3vw,30px);margin-top:18px;box-shadow:0 20px 60px #0002}.primary{background:#e5bc69;color:#182126;border:0;border-radius:12px;font-weight:750;padding:15px 22px;min-height:50px}.primary:hover{background:#f2d291}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;align-items:center}.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:18px 0}.pillar{background:#101b24;border:1px solid #ffffff1c;border-radius:12px;padding:12px 10px}.pillar-name{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:12px;color:#d1d9d8}.pillar b{font-size:27px;color:var(--c);font-variant-numeric:tabular-nums}.meter{height:7px;background:#ffffff15;border-radius:20px;overflow:hidden;position:relative}.meter i{display:block;height:100%;background:var(--c);border-radius:20px}.status{display:flex;justify-content:space-between;gap:10px;align-items:center}.progress{height:5px;background:#ffffff19;border-radius:6px;margin-top:8px}.progress i{display:block;height:100%;background:#e5bc69;border-radius:6px}.choices{display:grid;gap:10px;margin-top:20px}.choice{display:flex;align-items:center;gap:14px;text-align:left;background:#203239;border:1px solid #ffffff25;border-radius:13px;padding:15px;min-height:72px;width:100%}.choice:hover{border-color:#e5bc69;background:#293e44}.choice .number{width:32px;height:32px;flex:none;display:grid;place-items:center;border:1px solid #e5bc6970;border-radius:50%;color:#e5bc69}.choice strong,.choice small{display:block}.choice small{color:#c4d0ce;font-size:13px;margin-top:3px}.choice .arrow{margin-left:auto;color:#e5bc69}.delta{font-size:13px;font-weight:700}.positive{color:#74d7ad}.negative{color:#ff9a9e}.neutral{color:#aab9bb}.score{font-size:64px;font-family:Georgia,serif;color:#e5bc69;line-height:1}.history{padding-left:22px;color:#d0d9d6}.history li{margin:10px 0}.muted{font-size:13px;color:#b5c5c5}.home-art{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0}.home-art div{border-radius:12px;overflow:hidden;background:#15232b;text-align:center}.home-art img{width:100%;height:clamp(85px,15vw,150px);object-fit:cover;display:block}.home-art span{display:block;font-size:12px;padding:8px 3px}footer{text-align:center;color:#a9b9b7;font-size:12px;padding:0 15px 20px}@media(max-width:480px){main{padding:14px 12px 30px}header{padding:14px 12px}.pillar{padding:8px 5px}.pillar-name{font-size:10px;gap:3px}.pillar b{font-size:23px}.panel{margin-top:12px}.pillars{gap:5px;margin:12px 0}.choice{padding:12px;gap:10px}.home-art span{font-size:10px}.actions .primary{width:100%}}
</style></head><body><header><div><strong>ÉQUILIBRE DES CHOIX</strong><small>UNE CRÉATION KHALAM · MODE DÉCOUVERTE</small></div><button id="home" type="button">Menu</button></header><main id="app"></main><footer>Chaque décision a des conséquences. · KHALAM</footer><script type="module">
import {PILLARS,SITUATIONS,LENGTH,newGame,valid,decide,next,bilan,explicationChoix} from './choix-simples.js?v=81';
const root=document.getElementById('app'),key='khalam_equilibre_choix_simples_v1';let game=null,view='home',storageOk=true;
try{const saved=JSON.parse(localStorage.getItem(key));if(valid(saved))game=saved;}catch{}
const save=()=>{try{localStorage.setItem(key,JSON.stringify(game));}catch{storageOk=false;}};
const sign=n=>n>0?'+'+n:String(n);
const bars=delta=>'<div class="pillars">'+PILLARS.map((p,i)=>'<div class="pillar" style="--c:'+p.color+'"><div class="pillar-name"><span aria-hidden="true">'+p.icon+'</span>'+p.name+'</div><b>'+game.values[i]+'</b><div class="meter" role="meter" aria-label="'+p.name+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+game.values[i]+'"><i style="width:'+game.values[i]+'%"></i></div>'+(delta?'<span class="delta '+(delta[i]>0?'positive':delta[i]<0?'negative':'neutral')+'">'+sign(delta[i])+'</span>':'')+'</div>').join('')+'</div>';
function render(){if(view==='home'){root.innerHTML='<section class="panel"><div class="eyebrow">Dix situations · Trois choix · Quatre piliers</div><h1>Chaque choix compte.</h1><p>Choisissez votre réponse à des situations de la vie. Préservez l’équilibre entre spiritualité, amour, santé et argent. Après dix décisions, découvrez votre bilan.</p><div class="home-art">'+['spirituality','love','health','money'].map((k,i)=>'<div><img src="./assets/'+k+'_art.webp" alt=""><span>'+PILLARS[i].name+'</span></div>').join('')+'</div><div class="actions">'+(game?'<button class="primary" data-do="resume">'+(game.history.length===LENGTH&&!game.pending?'Voir mon bilan':'Reprendre ma partie')+'</button>':'')+'<button class="'+(game?'secondary':'primary')+'" data-do="start">'+(game?'Nouvelle partie':'Jouer maintenant')+'</button><a href="./?vue=immersive">Mode classique</a> · <a href="./?vue=strategie">Mode stratégie</a></div></section><p class="muted">Les scores sont des règles de jeu fictives, pas des jugements sur vos décisions réelles. '+(storageOk?'Sauvegarde sur cet appareil.':'Sauvegarde indisponible.')+'</p>';return;}
if(game.history.length===LENGTH&&!game.pending){const b=bilan(game);root.innerHTML='<section class="panel"><div class="eyebrow">Vos dix décisions</div><h1>'+b.title+'</h1><div class="score">'+b.score+'<small style="font-size:24px"> / 100</small></div><p>'+b.zone+' pilier(s) sur 4 dans la zone d’équilibre (35 à 65). Toute valeur de 35 à 65 est harmonieuse : la perfection n’est pas nécessaire.</p>'+bars()+'<details><summary>Revoir mes décisions</summary><ol class="history">'+game.history.map(h=>'<li><strong>'+SITUATIONS[h.situation][1]+'</strong><br>'+SITUATIONS[h.situation][3][h.choice][0]+'</li>').join('')+'</ol></details><div class="actions"><button class="primary" data-do="start">Rejouer</button><button class="secondary" data-do="home">Menu</button></div></section>';return;}
const n=game.pending?game.history.length:game.history.length+1,s=SITUATIONS[game.order[n-1]],h=game.pending?game.history.at(-1):null;
root.innerHTML='<div class="status"><span class="eyebrow">Décision '+n+' / '+LENGTH+'</span><span class="muted">'+s[0]+'</span></div><div class="progress" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="10" aria-valuenow="'+game.history.length+'"><i style="width:'+game.history.length*10+'%"></i></div>'+bars(h?.delta)+'<section class="panel" aria-live="polite"><div class="eyebrow">'+(h?'Votre décision':'La situation')+'</div><h2>'+s[1]+'</h2>'+(h?'<p><strong style="color:#f5efdf">'+s[3][h.choice][0]+'</strong></p><p>'+s[3][h.choice][1]+'</p><p class="muted">'+explicationChoix(h.situation,h.choice)+'</p>'+(h.echo?'<section style="border:1px solid #c5a059;padding:16px;border-radius:12px;margin:16px 0"><div class="eyebrow">Les échos du destin · Tour '+h.echo.origine+'</div><h2>'+h.echo.titre+'</h2><p>'+h.echo.texte+'</p><p>'+h.echo.note+'</p></section>':'')+'<div class="actions"><button class="primary" data-do="next">'+(n===LENGTH?'Voir mon bilan':'Situation suivante')+' →</button></div>':'<p>'+s[2]+'</p><div class="eyebrow" style="margin-top:22px">Que décidez-vous ?</div><div class="choices">'+s[3].map((c,i)=>'<button class="choice" data-do="choose" data-choice="'+i+'"><span class="number">'+(i+1)+'</span><span><strong>'+c[0]+'</strong><small>'+c[1]+'</small></span><span class="arrow" aria-hidden="true">›</span></button>').join('')+'</div>')+'</section><p class="muted">Objectif : maintenir vos quatre piliers dans la zone d’harmonie. Aucun calcul à faire.</p>';
}
root.addEventListener('click',e=>{const b=e.target.closest('button[data-do]');if(!b)return;const a=b.dataset.do;if(a==='start'){if(game&&game.history.length<LENGTH&&!confirm('Remplacer votre partie en cours ?'))return;game=newGame();view='game';save();}else if(a==='resume'&&game){view='game';}else if(a==='home'){view='home';}else if(a==='choose'){game=decide(game,Number(b.dataset.choice));save();}else if(a==='next'){game=next(game);save();}render();window.scrollTo({top:0});root.querySelector('button')?.focus({preventScroll:true});});
document.getElementById('home').addEventListener('click',()=>{view='home';render();});render();
</script></body></html>
